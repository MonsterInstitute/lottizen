# Outreach radar settings: scripts/outreach_radar.py and scripts/press_radar.py.
# Edit freely; both scripts read this file on every run, nothing is cached.
#
# Matching is case-insensitive substring matching on title + body. A post is
# assigned the FIRST topic (in file order) whose keywords match.

# Sources: Google News + Hacker News (+ X with a paid key). Reddit was
# evaluated and dropped on 2026-10-04 (API now needs manual approval); see
# docs/OPERATIONS.md § 7 "Outreach sources" before trying it again.

[news]
# Google News RSS queries, Canada edition. "when:2d" keeps each run to recent items.
queries = [
  'lottery unclaimed prize (Canada OR Ontario OR OLG OR BCLC OR WCLC OR "Loto-Québec" OR "Atlantic Lottery") when:2d',
  '"Lotto Max" jackpot when:2d',
  '"Lotto 6/49" jackpot when:2d',
  '"scratch ticket" OR "scratch tickets" (Canada OR Ontario OR OLG OR BCLC) when:2d',
  'lottery spending survey Canada when:7d',
  'lottery winner claim deadline Canada when:2d',
]
# Articles must mention at least one of these to count as Canadian lottery news.
must_mention_any = [
  "canada", "canadian", "ontario", "olg", "bclc", "wclc", "loto-québec", "loto-quebec",
  "atlantic lottery", "alberta", "saskatchewan", "manitoba", "british columbia",
  "quebec", "nova scotia", "new brunswick",
]
# "Lotto Max" and "6/49" also exist in South Africa and the Philippines.
must_not_mention = ["pcso", "philippine", "swertres", "south africa", "ithuba", "lotto plus"]
# Results round-ups and "who won" stories score as routine: their reporters
# still go into the contacts list, but they don't reach the email by themselves.
routine_patterns = [
  "winning numbers", "results for", "lottery results", "draw results", "are out", "where all the big winners",
  "winners across", "produced a new millionaire", "produces many winners", "jackpot grows", "jackpot reaches",
  "jackpot rolls", "estimated jackpot", "maxmillions", "million jackpot",
  # individual-winner stories
  "millionaire", " wins ", " win ", "winner", "winning ticket", "thousands win", "big win",
]
# A routine-looking title still scores as full news when the article is about
# one of these topics (e.g. "Winning ticket worth $1M unclaimed, expires soon").
routine_exempt_topics = ["unclaimed", "scratch", "data"]
# Fetch each article page to read its byline (JSON-LD / meta author).
fetch_bylines = true

[hn]
queries = ["lottery", "lotto", "scratch ticket"]
# HN items must also mention one of these (keeps out "lottery" as a metaphor).
must_mention_any = ["data", "api", "dataset", "statistic", "odds", "open data", "scrap", "draw history", "probability"]

[x]
# Needs X API v2 recent search (paid tier). Without X_BEARER_TOKEN the X
# source is skipped and the run log says so.
query = '(lottery OR lotto) (data OR API OR dataset OR statistics) lang:en -is:retweet'

# --------------------------------------------------------------- drafts
[drafts]
# Gemini model for reply drafts (needs GEMINI_API_KEY). gemini-3.8-flash
# costs about $0.002 a draft. gemini-3.5-flash-lite is cheaper but got claim
# deadlines vague in testing (2026-10-04).
model = "gemini-3.8-flash"

# --------------------------------------------------------------- topics
# `page` / `data` say which of our pages and figures answer the topic.
# data keys are computed live in scripts/outreach_common.py (facts_for()).

[[topics]]
key = "unclaimed"
keywords = [
  "unclaimed prize", "unclaimed lottery", "unclaimed ticket", "expired lottery ticket",
  "expired ticket", "claim deadline", "how long to claim", "lost lottery ticket",
  "forgot to claim", "lottery ticket expire", "still claim", "can i claim", "is it expired",
  "how long do you have", "old lottery ticket", "old lotto",
]
data = ["claim_deadlines", "unclaimed_list"]

[[topics]]
key = "scratch"
keywords = [
  "scratch ticket odds", "best scratch off", "best scratch ticket", "which scratch ticket",
  "scratch ticket", "scratch tickets", "scratch off", "scratchers", "instant ticket",
  "remaining prizes", "top prizes left",
]
data = ["scratch_top"]

[[topics]]
key = "numbers"
keywords = [
  "lotto max numbers", "6/49 numbers", "649 numbers", "hot cold numbers", "hot and cold numbers",
  "most common lotto numbers", "most drawn numbers", "lottery statistics", "lotto statistics",
  "lucky numbers", "number frequency", "overdue numbers",
]
data = ["number_frequency"]

[[topics]]
key = "jackpot"
keywords = ["lotto max jackpot", "6/49 jackpot", "649 jackpot", "max millions", "jackpot rolls"]
data = ["jackpot"]

[[topics]]
key = "data"
keywords = ["lottery data", "lottery api", "lotto api", "lottery dataset", "open data", "draw history"]
data = ["api"]

# --------------------------------------------------------------- scoring
# value_score = source base + engagement bonus. Only two sources score now:
#   news  70 on our topics (unclaimed prizes, scratch tickets, spending, data),
#         25 for results round-ups. No engagement data exists for articles.
#   HN    base by kind, plus up to engagement_cap from comments and points:
#         4*log2(1+comments) + 2*log2(1+points). An Ask HN with 10 comments /
#         15 points ≈ 40 + 22 = 62; a busy link thread (50 / 100) = 20 + 30 = 50;
#         a quiet one (5 / 8) ≈ 37 and stays out of the email.
# X (if X_BEARER_TOKEN is set) is scored like HN, with replies and likes.
[scoring]
base_news = 70
base_news_routine = 25   # see news.routine_patterns
base_question = 40       # HN post that asks something (incl. every "Ask HN")
base_discussion = 20     # HN link/discussion post
base_comment = 25        # an HN comment that asks something
engagement_cap = 30
question_markers = [
  "?", "ask hn", "which ", "what ", "how ", "should i", "is it worth", "anyone know", "does anyone",
  "recommend", "best ", "help",
]
# Only opportunities at or above this go into the digest email.
email_threshold = 45
# Most items per digest (highest score first).
max_per_email = 12
# Ignore posts older than this.
max_age_hours = 72

# --------------------------------------------------------------- press radar
[press]
# Fire a jackpot pitch when the next advertised jackpot reaches these amounts
# (in the game's own currency). Games with no published estimate in our data
# never fire; press_radar.py says so in its log.
jackpot_thresholds = { "lotto-max" = 60_000_000, "lotto-6-49" = 30_000_000, "powerball" = 500_000_000, "euromillions" = 150_000_000 }
unclaimed_min_amount = 1_000_000
unclaimed_days_ahead = 60

# Unclaimed prizes from agencies whose lists we don't scrape yet (BCLC, WCLC,
# ALC, Loto-Québec). Add one when a news story or agency release names it;
# press_radar.py treats these exactly like scraped OLG rows.
# [[press.manual_unclaimed]]
# agency = "BCLC"
# game = "Lotto 6/49"
# draw_date = "2025-12-20"
# amount = 2000000
# location = "Surrey"
# expires = "2026-12-20"
# source_url = "https://..."
