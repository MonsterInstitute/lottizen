name: Press radar

# Media-timing triggers (scripts/press_radar.py): a jackpot over its threshold,
# or a $1M+ listed unclaimed prize within 60 days of its claim deadline. Emails
# the owner a pitch package per event, once per event; nothing goes to
# journalists automatically.
#
# 13:00 UTC (~9am ET): after draws-daily.yml (10:10) has refreshed jackpot
# estimates, and early enough in the day to pitch the same morning.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: press-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OUTREACH_EMAIL: ${{ secrets.OUTREACH_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prefetch published site data
        run: node scripts/prefetch_supabase.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip supabase certifi

      - name: Check triggers and send pitch packages
        run: python scripts/press_radar.py
