name: Daily US draw results

# Pull the latest US draws from data.ny.gov every morning (it updates daily) and
# recompute statistics. Separate from the Canada workflow so they don't interfere.
on:
  schedule:
    - cron: "30 10 * * *" # ~06:30 ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: usa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch US draws (data.ny.gov)
        run: python scripts/scrape_usa.py || echo "US fetch failed; keeping last-good data"
        continue-on-error: true
      - name: Recompute statistics
        run: python scripts/calculate_stats.py
      - name: Commit refreshed data
        run: |
          git config user.name "lottizen-bot"
          git config user.email "bot@lottizen.ca"
          git add data/draws data/stats data/lottizen.db
          if git diff --staged --quiet; then
            echo "No US draw changes."
          else
            git commit -m "chore(data): daily US draw refresh $(date -u +%Y-%m-%d)"
            git push
          fi
