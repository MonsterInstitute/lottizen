name: Daily US draw results

# Pull the latest US draws from data.ny.gov every morning (it updates daily) and
# recompute statistics. Separate from the Canada workflow so they don't interfere.
on:
  schedule:
    - cron: "30 10 * * *" # ~06:30 ET
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: usa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch US draws (data.ny.gov)
        run: python scripts/scrape_usa.py || echo "US fetch failed; keeping last-good data"
        continue-on-error: true
      - name: Recompute statistics
        run: python scripts/calculate_stats.py
      # Deploy gate: build + audit before committing; CRITICAL/HIGH findings skip the commit.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit
      - name: Commit & push refreshed data (race-safe)
        env:
          REGEN_CMD: "python scripts/scrape_usa.py || true; python scripts/calculate_stats.py"
          GIT_ADD_PATHS: "data/draws data/stats data/lottizen.db"
        run: |
          export COMMIT_MSG="chore(data): daily US draw refresh $(date -u +%Y-%m-%d)"
          bash scripts/commit_and_push.sh

      - name: Report failure as a GitHub issue
        if: failure()
        uses: ./.github/actions/notify-failure
