name: Daily US draw results

# Pull the latest US draws from data.ny.gov every morning (it updates daily) and
# recompute statistics. Separate from the Canada workflow so they don't interfere.
#
# Data layer: Supabase. Scraper writes the draws table; the calculator renders
# per-game JSON, published to site_json. No git commit — the Vercel deploy hook
# rebuilds from Supabase.
on:
  schedule:
    - cron: "30 10 * * *" # ~06:30 ET
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: usa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREFETCH_FILL_MISSING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch US draws (data.ny.gov) -> Supabase
        id: scrape
        # Keeps last-good data on failure so the rest of the run still
        # publishes and deploys — but the job is failed at the end (see the
        # last step) so a broken source is seen the same day.
        run: python scripts/scrape_usa.py
        continue-on-error: true
      - name: Recompute statistics (reads Supabase -> data/draws + data/stats)
        run: python scripts/calculate_stats.py
      # Deploy gate: build + audit before publish/deploy; CRITICAL/HIGH skip them.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit
      - name: Publish JSON to Supabase (site_json)
        run: python scripts/publish_site_json.py draws stats
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "✓ Vercel deploy triggered"

      # Instant draw-result emails — see draws-daily.yml for the full note.
      - name: Send draw-result emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_draw_emails.py
        continue-on-error: true

      # Failure alerting: ci-failure-alert.yml. Staleness: freshness-watchdog.yml.

      # Tell IndexNow engines (Bing & co.) about pages whose content changed in
      # this run: only URLs whose sitemap lastmod moved, and only once the new
      # deploy is live (it waits up to 10 min, so it runs after the emails).
      # Never fails the refresh.
      - name: IndexNow — submit changed pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/indexnow_submit.py --trigger "${{ github.workflow }}"
        continue-on-error: true

      # Last step on purpose: everything above ran on last-good data, so failing
      # here costs nothing but makes the run red, which ci-failure-alert.yml turns
      # into an "[auto] CI failure" issue the same day instead of waiting for the
      # freshness watchdog to notice stale data.
      - name: Fail the run if the scrape failed
        if: ${{ steps.scrape.outcome == 'failure' }}
        run: |
          echo "::error title=Scrape failed::The scrape step failed; last-good data was kept and published. See that step's log and annotations."
          exit 1
