name: Daily US draw results

# Pull the latest US draws from data.ny.gov every morning (it updates daily) and
# recompute statistics. Separate from the Canada workflow so they don't interfere.
#
# Data layer: Supabase. Scraper writes the draws table; the calculator renders
# per-game JSON, published to site_json. No git commit — the Vercel deploy hook
# rebuilds from Supabase.
on:
  schedule:
    - cron: "30 10 * * *" # ~06:30 ET
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: usa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREFETCH_FILL_MISSING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch US draws (data.ny.gov) -> Supabase
        run: python scripts/scrape_usa.py || echo "US fetch failed; keeping last-good data in Supabase"
        continue-on-error: true
      - name: Recompute statistics (reads Supabase -> data/draws + data/stats)
        run: python scripts/calculate_stats.py
      # Deploy gate: build + audit before publish/deploy; CRITICAL/HIGH skip them.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit
      - name: Publish JSON to Supabase (site_json)
        run: python scripts/publish_site_json.py
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "✓ Vercel deploy triggered"

      # Failure alerting: ci-failure-alert.yml. Staleness: freshness-watchdog.yml.
