name: Daily draw results

# Fetch the newest Canadian draw results every morning ~6:00 AM Eastern and
# recompute statistics. 10:00 UTC = 06:00 EDT / 05:00 EST. Full history was
# backfilled once via `scrape_draws.py --backfill`; this only appends the latest
# draws (never overwrites reconciled/verified history).
#
# Data layer: Supabase. Scraper writes the draws table; the calculator renders
# per-game JSON, published to site_json. No git commit — the Vercel deploy hook
# rebuilds from Supabase.
on:
  schedule:
    - cron: "10 10 * * *" # staggered off daily.yml (0 10) / usa-daily.yml (30 10)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: draws-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREFETCH_FILL_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch latest draws -> Supabase (append-only)
        run: python scripts/scrape_draws.py || echo "draw fetch failed; keeping last-good data in Supabase"
        continue-on-error: true

      - name: Recompute statistics (reads Supabase -> data/draws + data/stats)
        run: python scripts/calculate_stats.py

      # Deploy gate: build (Node prefetch fills rankings.json from Supabase, keeps
      # fresh draws/stats) + audit. CRITICAL/HIGH findings skip publish + deploy.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit

      - name: Publish JSON to Supabase (site_json)
        run: python scripts/publish_site_json.py draws stats

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "✓ Vercel deploy triggered"

      # Instant draw-result emails for subscribers following a game that drew
      # today (see supabase/migrations/0004_subscribers.sql). Reads the
      # data/draws + data/stats + data/rankings.json already on disk from the
      # build step above. Never fails the workflow: send_draw_emails.py logs
      # and no-ops per-send if RESEND_API_KEY isn't set yet.
      - name: Send draw-result emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_draw_emails.py
        continue-on-error: true

      # Failure alerting: ci-failure-alert.yml. Staleness: freshness-watchdog.yml.
