name: Daily draw results

# Fetch the newest draw results every morning ~6:00 AM Eastern.
# 10:00 UTC = 06:00 EDT (summer) / 05:00 EST (winter). Full history was
# backfilled once via `scrape_draws.py --backfill`; this only appends the
# latest draws (never overwrites reconciled history) and recomputes stats.
on:
  schedule:
    # Staggered off daily.yml (0 10) / usa-daily.yml (30 10) so the workflows don't
    # push to main at the same instant; commit_and_push.sh handles any remaining race.
    - cron: "10 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: draws-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch latest draws (append-only)
        run: python scripts/scrape_draws.py || echo "draw fetch failed; keeping last-good data"
        continue-on-error: true

      - name: Recompute statistics
        run: python scripts/calculate_stats.py

      # Deploy gate: build the site and audit it before committing. A CRITICAL or
      # HIGH finding fails here and skips the commit below, so bad data never ships.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit

      - name: Commit & push refreshed data (race-safe)
        env:
          REGEN_CMD: "python scripts/scrape_draws.py || true; python scripts/calculate_stats.py"
          GIT_ADD_PATHS: "data/draws data/stats data/lottizen.db"
        run: |
          export COMMIT_MSG="chore(data): daily draw refresh $(date -u +%Y-%m-%d)"
          bash scripts/commit_and_push.sh

      # Vercel's Git integration auto-deploys on push (see daily.yml note).

      - name: Report failure as a GitHub issue
        if: failure()
        uses: ./.github/actions/notify-failure
