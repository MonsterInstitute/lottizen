name: Scratch — OLG (Ontario) daily refresh

# Rebuild the scratch-game rankings every morning ~6:00 AM Eastern.
# GitHub cron is UTC-only; 10:00 UTC = 06:00 EDT (summer) / 05:00 EST (winter).
#
# One of 5 independent per-agency scratch workflows (OLG/BCLC/WCLC/ALC/Quebec —
# see scratch-bclc-daily.yml etc.), staggered so one agency's outage never
# blocks or delays another's. calculate_rankings.py always recomputes ALL 5
# provinces from whatever's currently in Supabase, regardless of which single
# agency's scraper just ran here — so every run republishes a fresh, complete
# 5-province rankings/ set even though it only scrapes one agency.
#
# Data layer: Supabase Postgres. The scraper writes games/prize_tiers, the
# calculator reads them back and renders data/rankings/{province}.json, which
# is published to the site_json table. There is NO git commit — the Vercel
# deploy hook rebuilds the site, whose Node prefetch pulls the JSON straight
# from Supabase.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read # no data commit anymore — just checkout

concurrency:
  group: scratch-olg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Deploy gate builds from this run's fresh local JSON + the other slices
      # pulled from Supabase; never clobber the fresh files before they're audited.
      PREFETCH_FILL_MISSING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape OLG -> Supabase (keep last-good data on failure)
        # --live exits non-zero and leaves the data untouched if it can't reach
        # OLG, so a bad morning keeps yesterday's data in Supabase instead of
        # wiping it. We continue either way and recompute from whatever's there.
        run: python scripts/scrape_olg.py --live || echo "scrape failed; keeping last-good data in Supabase"
        continue-on-error: true

      - name: Recompute rankings for all 5 provinces (reads Supabase -> data/rankings/*.json)
        run: python scripts/calculate_rankings.py

      # Deploy gate: build the site (Node prefetch fills the draws/stats slices
      # from Supabase, keeping the fresh rankings/*.json) and audit it. A CRITICAL
      # or HIGH finding fails here and the publish + deploy steps below never run,
      # so bad data never ships.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit

      - name: Send Lottizen Plus scratch alerts (top prize claimed / new ticket / rank drop)
        # Reads today's + yesterday's scratch_snapshots directly from Supabase — independent
        # of the build above. Runs after the audit gate so alerts never fire off data that
        # failed the deploy gate. Never fails the workflow: a subscriber email hiccup
        # shouldn't block publish/deploy below.
        run: python scripts/scratch_alerts.py || echo "scratch alerts step failed; continuing"
        continue-on-error: true

      - name: Publish JSON to Supabase (site_json)
        run: python scripts/publish_site_json.py rankings

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "✓ Vercel deploy triggered"

      # Failure alerting is handled out-of-band by ci-failure-alert.yml
      # (on: workflow_run), which fires even when this job never acquires a runner.
      # Data staleness is separately caught by freshness-watchdog.yml.
