name: Tests

# Unit tests for rules that decide what the site tells people to buy or skip
# (scripts/tests). Runs on every push and PR touching scripts/.
on:
  push:
    paths: ["scripts/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scripts/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q scripts/tests
