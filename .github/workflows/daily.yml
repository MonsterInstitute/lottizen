name: Daily OLG refresh

# Rebuild the rankings every morning ~6:00 AM Eastern.
# GitHub cron is UTC-only; 10:00 UTC = 06:00 EDT (summer) / 05:00 EST (winter).
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # commit refreshed data back to the repo

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape OLG (keep last-good data on failure)
        id: scrape
        # --live exits non-zero and leaves the DB untouched if it can't reach
        # OLG, so a bad morning keeps yesterday's committed data instead of
        # wiping it. We continue either way and recompute from whatever's there.
        run: python scripts/scrape_olg.py --live || echo "scrape failed; using last-good DB"
        continue-on-error: true

      - name: Recompute rankings
        run: python scripts/calculate_rankings.py

      # Deploy gate: build the site and audit it before committing. A CRITICAL or
      # HIGH finding fails here and skips the commit below, so bad data never ships.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "lottizen-bot"
          git config user.email "bot@lottizen.ca"
          git add data/rankings.json data/lottizen.db
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore(data): daily OLG refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel's Git integration auto-deploys on push. If you'd rather trigger
      # explicitly (e.g. Deploy Hook), set the VERCEL_DEPLOY_HOOK secret.
      - name: Trigger Vercel deploy (optional)
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$HOOK" && echo "Vercel deploy triggered."
