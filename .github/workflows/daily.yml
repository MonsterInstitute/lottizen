name: Daily OLG refresh

# Rebuild the rankings every morning ~6:00 AM Eastern.
# GitHub cron is UTC-only; 10:00 UTC = 06:00 EDT (summer) / 05:00 EST (winter).
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # commit refreshed data back to the repo
  issues: write # open a failure issue if the run fails

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape OLG (keep last-good data on failure)
        id: scrape
        # --live exits non-zero and leaves the DB untouched if it can't reach
        # OLG, so a bad morning keeps yesterday's committed data instead of
        # wiping it. We continue either way and recompute from whatever's there.
        run: python scripts/scrape_olg.py --live || echo "scrape failed; using last-good DB"
        continue-on-error: true

      - name: Recompute rankings
        run: python scripts/calculate_rankings.py

      # Deploy gate: build the site and audit it before committing. A CRITICAL or
      # HIGH finding fails here and skips the commit below, so bad data never ships.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit

      - name: Commit & push refreshed data (race-safe)
        env:
          REGEN_CMD: "python scripts/scrape_olg.py --live || true; python scripts/calculate_rankings.py"
          GIT_ADD_PATHS: "data/rankings.json data/lottizen.db"
        run: |
          export COMMIT_MSG="chore(data): daily OLG refresh $(date -u +%Y-%m-%d)"
          bash scripts/commit_and_push.sh

      # Vercel's Git integration auto-deploys on push.
      #
      # Failure alerting is handled out-of-band by ci-failure-alert.yml
      # (on: workflow_run), which fires even when this job never acquires a
      # runner — an in-job `if: failure()` step cannot, since no steps run and
      # `failure()` doesn't trigger on a `cancelled` conclusion. Data staleness
      # from any cause is separately caught by freshness-watchdog.yml.
