name: CI failure alert

# Robust failure alerting for the data workflows. This fires as its OWN run
# *after* a data workflow completes (via workflow_run), so it works even when the
# data job never acquired a runner — the conclusion is then `cancelled` with zero
# steps, which an in-job `if: failure()` step can NEVER catch (no runner = no
# steps run; and `failure()` doesn't trigger on `cancelled` anyway). That exact
# mode hit us on Jul 9 and produced no alert. This replaces the old in-job
# notify-failure step. Opens (or comments on) one issue per failing workflow, and
# closes it again when that workflow next succeeds.
#
# Matches on each workflow's `name:` field (workflow_run keys off that, not the
# filename) — kept in sync by hand with every scratch-*-daily.yml's `name:`.
on:
  workflow_run:
    workflows:
      - "Scratch — OLG (Ontario) daily refresh"
      - "Scratch — BCLC (British Columbia) daily refresh"
      - "Scratch — WCLC (Western Canada (AB/SK/MB)) daily refresh"
      - "Scratch — ALC (Atlantic Canada (NB/NS/PE/NL)) daily refresh"
      - "Scratch — Loto-Québec (Quebec) daily refresh"
      - "Daily draw results"
      - "Daily US draw results"
      - "Daily European draw results"
      - "Claim reminders"
      - "Unclaimed prizes daily refresh"
      - "News from the data"
      - "Owner daily report"
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    # Runs on every completion except `skipped`. Anything that isn't a clean
    # success (failure, cancelled incl. runner-not-acquired, timed_out) opens or
    # comments on the workflow's issue; a success auto-closes it. Without the
    # auto-close these issues stayed open for months after a one-off failure and
    # buried the real ones.
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          # "[auto] " + the auto-monitor label mark every watchdog-opened issue.
          title="[auto] CI failure: ${WF_NAME}"
          # List open issues directly and match the exact title in jq — NOT
          # `gh issue list --search`, whose index lags creation by seconds and
          # would spawn duplicates on rapid successive failures.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq "map(select(.title==\"$title\")) | .[0].number // empty")
          if [ "$WF_CONCLUSION" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "✅ Recovered — next run succeeded: $RUN_URL. Auto-closing." >/dev/null
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
              echo "Closed #$existing (recovered)"
            fi
            exit 0
          fi
          body=$(printf '`%s` concluded **%s** (not success).\n\nFailed run: %s\nStarted: %s\n\nOpened automatically by the CI failure alerter (`workflow_run`); auto-closes on the next successful run. A `cancelled` conclusion with zero steps almost always means GitHub could not acquire a hosted runner that morning — just re-run the workflow (Actions → the workflow → Run workflow). The freshness watchdog will also re-dispatch the data workflows automatically if this left the data stale. See docs/OPERATIONS.md → runbooks.' \
            "$WF_NAME" "$WF_CONCLUSION" "$RUN_URL" "$RUN_STARTED")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on existing issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label auto-monitor
            echo "Opened a new failure issue"
          fi
