name: Resend delivery diagnose

# Manual-only. Answers "why didn't that email arrive?" using Resend's own
# delivery records rather than inference — see scripts/resend_diagnose.py.
# Sends exactly one real probe email, to the owner (OPS_REPORT_EMAIL).
#
# There is deliberately no "to" input: this repo and its Actions logs are
# public, and a typed-in address is expanded into the step's logged command.
# Before 2026-10-05 it was, twice. Secrets are masked in logs; inputs aren't.
on:
  workflow_dispatch:
    inputs:
      template:
        description: "Send the real draw-result template instead of a plain probe"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Resend delivery
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROBE_TO: ${{ secrets.OPS_REPORT_EMAIL }}
        run: python scripts/resend_diagnose.py --to "$PROBE_TO" ${{ inputs.template && '--template' || '' }}
