name: Daily European draw results

# European games draw on Tue & Fri (EuroMillions, EuroJackpot) and Wed & Sat
# (UK Lotto). Run at 23:00 UTC on each of those days — after that evening's draw
# has settled — to append the latest results. Full history was backfilled once via
# `scrape_europe.py --backfill`; this only appends (never overwrites reconciled
# rows) and recomputes stats. Separate from the CA/US workflows so they don't clash.
on:
  schedule:
    - cron: "0 23 * * 2,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: europe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch latest European draws (append-only)
        run: python scripts/scrape_europe.py || echo "EU fetch failed; keeping last-good data"
        continue-on-error: true
      - name: Recompute statistics
        run: python scripts/calculate_stats.py
      # Deploy gate: build + audit before committing; CRITICAL/HIGH findings skip the commit.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit
      - name: Commit & push refreshed data (race-safe)
        env:
          REGEN_CMD: "python scripts/scrape_europe.py || true; python scripts/calculate_stats.py"
          GIT_ADD_PATHS: "data/draws data/stats data/lottizen.db data/conflicts.log"
        run: |
          export COMMIT_MSG="chore(data): daily European draw refresh $(date -u +%Y-%m-%d)"
          bash scripts/commit_and_push.sh

      # Failure alerting: ci-failure-alert.yml (on: workflow_run) — robust to the
      # runner-not-acquired case that an in-job failure() step can't catch.
      # Staleness: freshness-watchdog.yml, judged from the committed DB.
