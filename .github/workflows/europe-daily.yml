name: Daily European draw results

# European games draw on Tue & Fri (EuroMillions, EuroJackpot) and Wed & Sat
# (UK Lotto). Run at 23:00 UTC on each of those days — after that evening's draw
# has settled — to append the latest results. Full history was backfilled once via
# `scrape_europe.py --backfill`; this only appends (never overwrites reconciled
# rows). Separate from the CA/US workflows so they don't clash.
#
# Data layer: Supabase. Scraper writes the draws table; the calculator renders
# per-game JSON, published to site_json. No git commit — the Vercel deploy hook
# rebuilds from Supabase.
on:
  schedule:
    - cron: "0 23 * * 2,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: europe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREFETCH_FILL_MISSING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Fetch latest European draws -> Supabase (append-only)
        run: python scripts/scrape_europe.py || echo "EU fetch failed; keeping last-good data in Supabase"
        continue-on-error: true
      - name: Recompute statistics (reads Supabase -> data/draws + data/stats)
        run: python scripts/calculate_stats.py
      # Deploy gate: build + audit before publish/deploy; CRITICAL/HIGH skip them.
      - name: Build & audit (deploy gate)
        uses: ./.github/actions/build-and-audit
      - name: Publish JSON to Supabase (site_json)
        run: python scripts/publish_site_json.py draws stats
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "✓ Vercel deploy triggered"

      # Instant draw-result emails — see draws-daily.yml for the full note.
      - name: Send draw-result emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_draw_emails.py
        continue-on-error: true

      # Failure alerting: ci-failure-alert.yml. Staleness: freshness-watchdog.yml.
