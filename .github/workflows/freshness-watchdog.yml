name: Data freshness watchdog

# The real safety net for stale data. Runs a few hours AFTER the data workflows
# and judges freshness from what is actually in Supabase — it never
# trusts a scrape exit code, so it catches every failure mode uniformly: a job
# that never acquired a runner, a scrape that silently fetched nothing, or a
# push that didn't land. For any live game whose newest draw is behind its own
# schedule it opens (or updates) a per-game GitHub issue, and it re-dispatches
# the data workflows so a transient miss self-heals by the next cycle instead of
# waiting for a human to notice. Games that recover get their issue auto-closed.
#
# Being a *separate* scheduled run is the whole point: an in-job freshness check
# dies with the job when GitHub fails to hand it a runner (exactly what happened
# on Jul 9). This run is independent of that.
#
# It ALSO checks the DEPLOYED site, not just committed data. On Jul 11 the data
# was fresh in git but Vercel had stopped completing builds, so the live site sat
# on a two-day-old snapshot — invisible to every data-only check. The deploy step
# below compares the live sitemap's build timestamp to now and opens a
# "Deployment stale" issue (and pings the Vercel deploy hook, if configured) when
# the site stops rebuilding.
on:
  schedule:
    # 14:00 UTC (~10:00 ET) — after daily.yml (10:00), draws-daily (10:10) and
    # usa-daily (10:30) UTC have had time to run, commit, and push.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Inject a synthetic stale game to fire-drill the alerting (no real data touched)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # open/close staleness issues
  actions: write # re-dispatch the data workflows to self-heal

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # Freshness is now judged from Supabase (draw_counts view) and the deployed
      # site, not a committed DB. check_deploy_freshness.py reads site_json too.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Supabase client
        # Lightweight: the watchdog only reads Supabase (no scraping/build), so it
        # needs supabase-py + certifi, not the full scraper toolchain.
        run: python -m pip install --upgrade pip supabase certifi

      - name: Compute freshness from Supabase
        id: fresh
        env:
          SELFTEST: ${{ github.event.inputs.selftest == 'true' && '--selftest' || '' }}
        run: |
          python scripts/audit_site.py --freshness $SELFTEST            # human-readable log
          python scripts/audit_site.py --freshness --json $SELFTEST > freshness.json
          count=$(python -c "import json; print(len(json.load(open('freshness.json'))['stale']))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Stale games: $count"

      - name: Open / update / close staleness issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/freshness_issues.sh freshness.json

      - name: Re-dispatch data workflows to self-heal
        # Skip during a --selftest fire-drill: the synthetic canary must not spray
        # real workflow dispatches.
        if: ${{ steps.fresh.outputs.count != '0' && github.event.inputs.selftest != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Stale data detected — re-dispatching data workflows to recover."
          for wf in daily.yml draws-daily.yml usa-daily.yml europe-daily.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" \
              && echo "re-dispatched $wf" \
              || echo "could not dispatch $wf (continuing)"
          done

      # ---- Deployment layer: is the LIVE site actually rebuilding? ----
      - name: Check deployed-site freshness
        id: deploy
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lottizen.com' }}
          SELFTEST: ${{ github.event.inputs.selftest == 'true' && '--selftest' || '' }}
        run: |
          python scripts/check_deploy_freshness.py $SELFTEST                 # human log
          python scripts/check_deploy_freshness.py $SELFTEST --json > deploy.json
          stale=$(python -c "import json; print('1' if json.load(open('deploy.json'))['stale'] else '0')")
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Open or close the deployment-stale issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STALE: ${{ steps.deploy.outputs.stale }}
        run: |
          set -euo pipefail
          title="Deployment stale: live site not updating"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq "map(select(.title==\"$title\")) | .[0].number // empty")
          if [ "$DEPLOY_STALE" = "1" ]; then
            body=$(jq -r '"The committed data is fresh, but the **live site is not rebuilding**.\n\n- Site: `\(.site)`\n- Deployed build (sitemap lastmod): `\(.deployedLastmod)`\n- Age at check: **\(.lagHours)h** (threshold \(.maxLagHours)h)\n- Error: \(.error)\n\nEvery data-side check reads the committed repo, so a broken deployment is invisible to them — the data pipeline is healthy but builds have stopped completing. Check the Vercel dashboard (Deployments / Usage & Billing) for failed or paused builds, then trigger a redeploy. Auto-closes once the live site rebuilds."' deploy.json)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" && echo "updated #$existing"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" && echo "opened deployment-stale issue"
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ Live site is rebuilding again — deployed build timestamp is current. Auto-closing." >/dev/null
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" && echo "closed #$existing (recovered)"
          fi

      - name: Ping Vercel deploy hook to self-heal (if configured)
        # Optional auto-heal: set the VERCEL_DEPLOY_HOOK secret to a Vercel Deploy
        # Hook URL and a stale deployment triggers a fresh production build. No-op
        # if the secret is unset. Skipped during --selftest.
        if: ${{ steps.deploy.outputs.stale == '1' && github.event.inputs.selftest != 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — skipping deploy-hook auto-heal."
            exit 0
          fi
          echo "Deployment stale — pinging Vercel deploy hook to trigger a rebuild."
          curl -fsS -X POST "$HOOK" && echo "deploy hook triggered" || echo "deploy hook failed (continuing)"
